<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erro {{ codigo }} · AJAPRA</title>
  <link rel="icon" href="{{ url_for('static', filename='ajapra_logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth">
  <main class="auth-card">
    <h1>{{ codigo }}</h1>
    <p>{% if codigo == 404 %}Página não encontrada.{% elif codigo == 403 %}Você não tem permissão para acessar esta página.{% else %}Ocorreu um erro inesperado.{% endif %}</p>
    <p><a class="btn primary" href="{{ url_for('page_dashboard') }}">Voltar ao painel</a></p>
  </main>
</body>
</html>
